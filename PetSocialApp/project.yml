name: PetSocialApp
options:
  bundleIdPrefix: com.petsocial
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.petsocial.app
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_CFBundleDisplayName: PetSocial
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.39.0
targets:
  PetSocialApp:
    type: application
    platform: iOS
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
